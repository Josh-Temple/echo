<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1315">
<title>ECHO — 残響</title><link rel="stylesheet" href="echo3d/style.css"></head>
<body><main id="game">
<div id="stage" aria-label="廃棄された貯水施設を歩く3Dゲーム"><div class="vignette"></div></div>
<header><a class="wordmark" href="index.html" aria-label="ECHO 2D版へ">ECHO</a><div class="topright"><span id="sector">03 / RESERVOIR</span><button id="pause" aria-label="一時停止・設定" title="Esc 一時停止">Ⅱ</button></div></header>
<div id="hint">A / D  移動 <span>SPACE  跳ぶ</span></div><div id="prompt" role="status"></div><div id="notice" role="status" aria-live="polite"></div>
<nav id="touch" aria-label="タッチ操作"><div class="cluster"><button data-action="left" aria-label="左へ移動">←</button><button data-action="right" aria-label="右へ移動">→</button></div><div class="cluster"><button data-action="use" aria-label="調べる">調べる</button><button data-action="jump" aria-label="跳ぶ">跳ぶ</button></div></nav>
<section id="intro" class="panel" aria-labelledby="intro-title"><div class="panel-inner"><p class="eyebrow">A PLACE THAT REMEMBERS</p><h1 id="intro-title">ECHO</h1><p class="subtitle">残響</p><div class="rule"></div><p class="intro-copy">水は、まだ動いている。<br>誰もいないはずの、その奥で。</p><button id="start" class="primary" disabled>準備しています</button><p class="chapter">CHAPTER 01 <span>貯水槽</span></p><p class="input-note">← → / A D：歩く　 SPACE：跳ぶ　 E：調べる</p></div></section>
<section id="menu" class="panel" role="dialog" aria-modal="true" aria-labelledby="menu-title" hidden><div class="panel-inner compact"><p class="eyebrow">ECHO / INTERMISSION</p><h2 id="menu-title">静寂のなかで</h2><button id="resume" class="primary">続ける</button><label class="setting">描画品質<select id="quality"><option value="auto">自動</option><option value="high">高</option><option value="medium">標準</option><option value="low">軽量</option></select></label><label class="setting">環境音<input id="sound" type="checkbox" checked></label><button id="fullscreen" class="secondary">全画面</button><button id="restart" class="secondary">最初から</button><p class="input-note">Esc：一時停止　E：扉を調べる</p></div></section>
<section id="ending" class="panel" aria-labelledby="end-title" hidden><div class="panel-inner"><p class="eyebrow">END OF THE FIRST PASSAGE</p><h2 id="end-title">残された気配。</h2><p class="intro-copy">向こうにいたのは、<br>誰だったのだろう。</p><button id="replay" class="primary">もう一度、歩く</button><p class="chapter">ECHO / CHAPTER 01</p></div></section>
<section id="fallback" class="panel" role="alert" hidden><div class="panel-inner"><h2>描画を中断しました</h2><p id="error-text"></p><button id="reload" class="primary">再読み込み</button><a href="index.html" class="secondary">2D版を開く</a></div></section>
</main><script type="module" src="echo3d/app.js"></script></body></html>
